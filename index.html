<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhamad Xalid | Software Engineer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: radial-gradient(circle at center, #1a1f29 0%, #0a0c10 100%);
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .developer-card {
        width: 100%;
        max-width: 380px;
        background: rgba(18, 24, 38, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.2);
        backdrop-filter: blur(12px);
        padding: 40px 25px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .profile-wrapper {
        position: relative;
        width: 130px;
        height: 130px;
        margin: 0 auto 20px;
    }

    .profile-wrapper img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #38bdf8;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .online-dot {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 16px;
        height: 16px;
        background-color: #10b981;
        border: 3px solid #121826;
        border-radius: 50%;
    }

    h1 {
        font-size: 26px;
        color: #ffffff;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }

    .title-tag {
        display: inline-block;
        font-size: 13px;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
        padding: 4px 12px;
        border-radius: 50px;
        font-weight: 600;
        margin-bottom: 25px;
        border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .links-box {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .dev-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #f1f5f9;
        text-decoration: none;
        padding: 16px 20px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .dev-link div {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .dev-link i.arrow {
        font-size: 12px;
        opacity: 0.5;
        transition: transform 0.3s ease;
    }

    .dev-link:hover {
        background: rgba(56, 189, 248, 0.15);
        border-color: #38bdf8;
        transform: translateY(-2px);
    }

    .dev-link:hover i.arrow {
        transform: translateX(4px);
        opacity: 1;
    }

    /* ڕەنگی تایبەتی ئایکۆنەکان */
    .fa-facebook { color: #1877F2; }
    .fa-snapchat { color: #EBAE00; }
    .fa-telegram { color: #27A7E7; }
    .fa-whatsapp { color: #25D366; }
    .fa-viber { color: #734098; }
    .fa-tiktok { color: #ffffff; }
    .fa-youtube { color: #FF0000; }
</style>
</head>
<body>

<div class="developer-card">
    <div class="profile-wrapper">
        <img src="me.png">
        <div class="online-dot"></div>
    </div>

    <h1>Muhamad Xalid</h1>
    <span class="title-tag">&lt; Software Developer /&gt;</span>

    <div class="links-box">

            <div><i class="fab fa-facebook fa-lg"></i> Facebook</div>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        <a class="dev-link" href="https://wa.me/9647503135235" target="_blank">
            <div><i class="fab fa-whatsapp fa-lg"></i> WhatsApp</div>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        <a class="dev-link" href="https://t.me/Muhamadxalid0" target="_blank">

            <i class="fas fa-chevron-right arrow"></i>

        <a class="dev-link" href="viber://add?number=9647503135235" target="_blank">

        <a class="dev-link" href="https://www.tiktok.com/@hamaheroyy?_r=1&_t=ZS-97liNkSNgox" target="_blank">

        <a class="dev-link" href="https://youtube.com/@hamauk-vm5uv?si=a86nhqgPmMmwAiSn" target="_blank">

</div>

</body>
